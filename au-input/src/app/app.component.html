<header class="l-header">
  <ul class="top-menu disable-link-styles">
    <li class="logo-small-container">
      <a class="v-center-block-parent">
        <img
          class="v-center-block logo-small angular-university-logo"
          src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png"
          data-pin-nopin="true"
        />
      </a>
    </li>
    <li>
      <a>Inputs</a>
    </li>
  </ul>
</header>

<body>
  <div class="container">
    <h1>Font Awesome</h1>

    <div class="form">
      <div class="form-row">
        <label>Normal Input:</label>
        <input
          class="normal-input"
          type="email"
          name="email"
          placeholder="E-mail"
          autocomplete="off"
        />
      </div>

      <div class="form-row">
        <label>Email:</label>
        <au-fa-input icon="envelope" id="email-field">
          <input type="email" name="email" placeholder="E-mail" autocomplete="off" class="test-class"/>
        </au-fa-input>
      </div>

      <div class="form-row au-fa-input-red-theme">
        <label>Password:</label>
        <au-fa-input icon="lock" id="password-field">
          <input placeholder="Password" class="test-class"/>
        </au-fa-input>
      </div>

      <div class="form-row stripe-field">
        <label>Stripe:</label>
        <au-fa-input icon="cc-stripe">
          <input placeholder="Stripe" />
        </au-fa-input>
      </div>

      <div class="form-row">
        <label>Paypal:</label>
        <au-fa-input icon="paypal">
          <input placeholder="PayPal" />
        </au-fa-input>
      </div>

      <div class="form-row">
        <label>Lock:</label>
        <au-md-input icon="search">
          <input placeholder="Lock" />
        </au-md-input>
      </div>

      <div class="form-row">
        <label>Id Number:</label>
        <au-md-input icon="perm_identity">
          <input placeholder="Id Number" />
        </au-md-input>
      </div>


      <div class="form-row">
        <label>Receipt number:</label>
        <au-md-input icon="receipt">
          <input placeholder="PayPal" />
        </au-md-input>
      </div>
    </div>
  </div>
</body>
